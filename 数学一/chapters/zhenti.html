<!-- 考研数学一 · 真题专区（2009-2025） -->
<meta charset="UTF-8">
<section class="chapter-card" id="zhenti">
    <div class="ch-header zhenti-header">
        <div class="ch-title">真题专区（2009-2025） <span class="ch-score">| 历年真题 + 解析</span></div>
        <div class="ch-stars star-high">五星级 真题实战</div>
    </div>

    <div class="zhenti-layout">
        <!-- 左侧：知识点树 -->
        <aside class="zhenti-sidebar" id="zhentiSidebar">
            <div class="sidebar-header">
                <h3>考点目录</h3>
                <input type="text" id="kpSearch" class="kp-search" placeholder="搜索考点...">
            </div>
            <div class="knowledge-tree" id="knowledgeTree">
                <!-- 由 JS 渲染 -->
            </div>
        </aside>

        <!-- 中间：缩略图条 + 题目列表 -->
        <main class="zhenti-main">
            <!-- Tab 切换：历年真题 / 进度总览 -->
            <div class="zhenti-tabs" id="zhentiTabs" role="tablist">
                <button type="button" class="zhenti-tab active" data-tab="list" role="tab" aria-selected="true">历年真题</button>
                <button type="button" class="zhenti-tab" data-tab="progress" role="tab" aria-selected="false">进度总览</button>
            </div>

            <!-- 缩略图条 -->
            <div class="zhenti-thumb-strip" id="thumbStrip">
                <div class="thumb-strip-header">
                    <span>历年试卷</span>
                    <span class="thumb-tip">点击缩略图放大查看</span>
                </div>
                <div class="thumb-strip-list" id="thumbList"></div>
            </div>

            <!-- 筛选栏 -->
            <div class="zhenti-filters" id="zhentiFilters">
                <div class="filter-row">
                    <div class="filter-group">
                        <label class="filter-label">年份</label>
                        <div class="filter-pills" id="filterYear">
                            <button class="filter-pill active" data-year="all">全部</button>
                        </div>
                    </div>
                    <div class="filter-group">
                        <label class="filter-label">板块</label>
                        <div class="filter-pills" id="filterPart">
                            <button class="filter-pill active" data-part="all">全部</button>
                            <button class="filter-pill" data-part="高数">高数</button>
                            <button class="filter-pill" data-part="线代">线代</button>
                            <button class="filter-pill" data-part="概率">概率</button>
                        </div>
                    </div>
                </div>
                <div class="filter-row">
                    <div class="filter-group">
                        <label class="filter-label">题型</label>
                        <div class="filter-pills" id="filterType">
                            <button class="filter-pill active" data-type="all">全部</button>
                            <button class="filter-pill" data-type="选择题">选择题</button>
                            <button class="filter-pill" data-type="填空题">填空题</button>
                            <button class="filter-pill" data-type="解答题">解答题</button>
                        </div>
                    </div>
                    <div class="filter-group">
                        <label class="filter-label">关键词搜索</label>
                        <input type="text" id="zhentiSearch" class="filter-input" placeholder="题号/知识点/题目关键字">
                    </div>
                </div>
                <div class="filter-row" id="filterKPRow" style="display:none;">
                    <div class="filter-group" style="flex:1;">
                        <label class="filter-label">当前考点：<span id="activeKPName">-</span> <button class="filter-pill" id="clearKP">清除</button></label>
                    </div>
                </div>
                <div class="filter-row">
                    <div class="filter-group">
                        <label class="filter-label">掌握程度</label>
                        <div class="filter-pills" id="filterMastery"></div>
                    </div>
                </div>
            </div>

            <!-- 题目列表 -->
            <div class="zhenti-content-area" id="zhentiContentArea">
                <div class="zhenti-loading">
                    <div class="spinner"></div>
                    <p>正在加载真题...</p>
                </div>
            </div>

            <!-- 进度总览（默认隐藏，切换到对应 Tab 时显示） -->
            <div class="zhenti-progress-area" id="zhentiProgressArea" hidden>
                <!-- 由 JS 渲染 -->
            </div>
        </main>
    </div>

    <!-- 掌握程度总览 -->
    <section class="zhenti-mastery-panel" id="zhentiMasteryPanel">
        <div class="mastery-stats" id="masteryStats"></div>
    </section>

    <!-- 把考点频率图放在题目下方，不占右侧 -->
    <section class="zhenti-charts-bottom" id="zhentiChartsBottom">
        <h3>考点考查频率（TOP 20）</h3>
        <div class="chart-container" id="kpChart"></div>
    </section>

    <!-- 缩略图放大弹窗 -->
    <div class="zhenti-modal" id="thumbModal" hidden>
        <div class="zhenti-modal-content zhenti-modal-large">
            <div class="zhenti-modal-header">
                <div class="zhenti-modal-title" id="thumbModalTitle">试卷详情</div>
                <button class="zhenti-modal-close" id="thumbModalClose">×</button>
            </div>
            <div class="zhenti-modal-body" id="thumbModalBody"></div>
        </div>
    </div>

    <!-- 题目详情弹窗 -->
    <div class="zhenti-modal" id="questionModal" hidden>
        <div class="zhenti-modal-content zhenti-modal-large">
            <div class="zhenti-modal-header">
                <div class="zhenti-modal-title" id="questionModalTitle">题目详情</div>
                <button class="zhenti-modal-close" id="questionModalClose">×</button>
            </div>
            <div class="zhenti-modal-body" id="questionModalBody"></div>
        </div>
    </div>
</section>
